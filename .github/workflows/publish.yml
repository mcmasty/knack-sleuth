name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  checks:
    # Same lint, type and test gates as pull requests; publish waits on them.
    uses: ./.github/workflows/test.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for trusted publishing
      contents: read
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      
      - name: Build package
        run: uv build
      
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
