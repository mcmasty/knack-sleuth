name: Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # The publish workflow calls this one so a release cannot skip the gates.
  workflow_call:

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails the job if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked --python 3.11

      - name: Ruff lint
        run: uv run --locked ruff check --output-format=github .

      - name: Ruff format
        run: uv run --locked ruff format --check .

      - name: Pyrefly
        run: uv run --locked pyrefly check

      - name: Dead code (vulture)
        run: uv run --locked vulture

      - name: Declared dependencies (deptry)
        run: uv run --locked deptry src

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests with coverage
        # Fails under [tool.coverage.report] fail_under in pyproject.toml.
        run: uv run --locked pytest -v --cov
