name: Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  # The publish workflow calls this one so a release cannot skip the gates.
  workflow_call:

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        # --locked fails the job if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked --python 3.11

      - name: Ruff
        run: uv run --locked ruff check --output-format=github .

      - name: Pyrefly
        run: uv run --locked pyrefly check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      
      - name: Run tests
        run: uv run pytest -v
      
      - name: Test coverage (optional)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv add --dev pytest-cov
          uv run pytest --cov=knack_sleuth --cov-report=term-missing
