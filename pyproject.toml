[project]
name = "knack-sleuth"
version = "0.11.0"
description = "Investigate your Knack.app's metadata to find where data objects and fields are used throughout your application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[project.scripts]
knack-sleuth = "knack_sleuth.cli:cli"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.2.4",
    "deptry>=0.25.1",
    "hypothesis>=6.170.15",
    "pre-commit>=4.7.0",
    "pyrefly>=1.3.2,<1.4",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.2",
    "types-pyyaml>=6.0.12.20261113",
    "vulture>=2.16",
]


[tool.bumpversion]
current_version = "0.11.0"
commit = true
tag = true
# Lock in lint debt paid off since the last release: lower lint-baseline.json to
# the code and include it in the bump commit. A failing hook aborts the bump
# before the commit and tag (restore the edited files with `git checkout .`).
pre_commit_hooks = [
    "uv run --locked python scripts/lint_ratchet.py --tighten",
    "git add lint-baseline.json",
]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

[[tool.bumpversion.files]]
filename = "src/knack_sleuth/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'

# The lock file pins this package's own version; without this the next uv
# command rewrites it after the bump and leaves the tree dirty. Anchored on the
# package name so it can't match another dependency that shares the version.
[[tool.bumpversion.files]]
filename = "uv.lock"
regex = true
search = 'name = "knack-sleuth"\nversion = "{current_version}"'
replace = 'name = "knack-sleuth"\nversion = "{new_version}"'

# Both skill copies carry a version stamp the CLI compares against the running
# package; they must move with the bump or the guard tests fail at release time.
[[tool.bumpversion.files]]
filename = "src/knack_sleuth/data/SKILL.md"
search = '<!-- knack-sleuth-version: {current_version} -->'
replace = '<!-- knack-sleuth-version: {new_version} -->'

[[tool.bumpversion.files]]
filename = ".claude/skills/knack-explorer/SKILL.md"
search = '<!-- knack-sleuth-version: {current_version} -->'
replace = '<!-- knack-sleuth-version: {new_version} -->'


[project.urls]
Homepage = "https://github.com/mcmasty/knack-sleuth"
Repository = "https://github.com/mcmasty/knack-sleuth"
Issues = "https://github.com/mcmasty/knack-sleuth/issues"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Types are pyrefly's job; formatting is `ruff format`'s.
select = [
    "E", "W", "F",  # pycodestyle + pyflakes
    "I",            # import sorting
    "B",            # bugbear: likely bugs
    "UP",           # pyupgrade
    "SIM",          # simplifications
    "C4",           # comprehensions
    "C90",          # mccabe complexity
    "PL",           # pylint subset, incl. size limits (PLR091x)
    "RUF",          # ruff-specific
    "S",            # bandit security
    "PT",           # pytest style
    "RET", "PIE", "PTH", "TRY", "ERA",
]
ignore = [
    "E501",     # line length is the formatter's job; it leaves long strings alone
    "TRY003",   # long messages in exception constructors are fine
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters as call defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest tests
    "PLR2004",  # magic numbers are expected values
]
# Typer commands take one parameter per CLI option.
"src/knack_sleuth/cli/*.py" = ["PLR0913"]
# A vulture whitelist is bare attribute expressions on an undefined name.
"vulture_whitelist.py" = ["B018", "F821"]
# Examples are linear demo scripts; size limits do not help them.
"examples/**" = ["C901", "PLR0912", "PLR0915", "PLR2004"]

[tool.vulture]
# Dead-code finder. Scans tests and examples too, so code only they use counts.
paths = ["src", "tests", "examples", "vulture_whitelist.py"]
min_confidence = 60
# Framework entry points that nothing calls by name.
ignore_decorators = [
    "@*.command",
    "@*.callback",
    "@field_validator",
    "@model_validator",
    "@pytest.fixture",
]
ignore_names = ["model_config", "cls"]
# TypedDict declarations: their keys are read as dict subscripts, which vulture
# cannot connect to the declaration. The type checker covers them instead.
exclude = ["src/knack_sleuth/rules_report.py"]

[tool.deptry]
known_first_party = ["knack_sleuth"]

[tool.coverage.run]
source = ["knack_sleuth"]
branch = true

[tool.coverage.report]
# Ratchet: raise as coverage improves, never lower.
fail_under = 90
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

[tool.pyrefly]
project-includes = ["src", "tests", "examples", "scripts"]
python-version = "3.11"
